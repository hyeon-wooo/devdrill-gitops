apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sttep-web
  namespace: sttep-dev
spec:
  parentRefs:
    - name: devdrill-gateway
      namespace: nginx-gateway
  # 게이트웨이의 sttep-https 리스너(*.sttep.work)가 이 이름을 받는다.
  hostnames:
    - "dev-app.sttep.work"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: sttep-web
          port: 8080
