apiVersion: apps/v1
kind: Deployment
metadata:
  name: sttep-web
  namespace: sttep-dev
  labels:
    app: sttep
    tier: web
    env: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sttep
      tier: web
      env: dev
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: sttep
        tier: web
        env: dev
      annotations:
        # config.js 를 바꾸면 이 값도 올려서 Pod 를 다시 띄운다(subPath 마운트는 갱신되지 않는다).
        sttep.work/config-revision: "1"
    spec:
      nodeSelector:
        dedicated: system
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "system"
      # init-private/sttep/api/ghcr-auth.secret.yaml 참고.
      imagePullSecrets:
        - name: ghcr-auth
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: sttep-web
          # 태그는 커밋 SHA 기반 불변 태그다. sttep-web 레포의 GitHub Actions 가 이 값을 바꿔
          # 커밋하면 그것이 곧 배포다. 가변 태그로 되돌리지 말 것.
          image: ghcr.io/hyeon-wooo/sttep-web:sha-ccc732b
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: sttep-web
