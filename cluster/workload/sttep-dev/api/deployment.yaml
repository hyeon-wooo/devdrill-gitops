apiVersion: apps/v1
kind: Deployment
metadata:
  name: sttep-api
  namespace: sttep-dev
  labels:
    app: sttep
    tier: api
    env: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sttep
      tier: api
      env: dev
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: sttep
        tier: api
        env: dev
    spec:
      nodeSelector:
        dedicated: system
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "system"
      # init-private/sttep/api/ghcr-auth.secret.yaml 참고.
      imagePullSecrets:
        - name: ghcr-auth
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        # 마이그레이션. 실패하면 새 Pod 가 뜨지 않고 이전 Pod 가 유지된다.
        - name: migrate
          # 태그는 커밋 SHA 기반 불변 태그다. sttep-api 레포의 GitHub Actions 가 이 줄과 아래 앱 컨테이너
          # 줄을 함께 바꿔 커밋하면 그것이 곧 배포다. 가변 태그로 되돌리지 말 것.
          image: ghcr.io/hyeon-wooo/sttep-api:sha-8086625
          command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
          envFrom:
            - secretRef:
                name: sttep-api
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      containers:
        - name: sttep-api
          image: ghcr.io/hyeon-wooo/sttep-api:sha-8086625
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: sttep-api
            # init-private/sttep/api/secret.yaml 참고.
            - secretRef:
                name: sttep-api
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: 3000
            periodSeconds: 5
            failureThreshold: 24 # 최대 120초
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
