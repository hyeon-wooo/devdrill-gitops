# 브라우저가 파일을 올리고 받는 공개 주소. api 가 이 호스트로 서명한 주소(presigned URL)를 만든다.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs
  namespace: sttep-dev
spec:
  parentRefs:
    - name: devdrill-gateway
      namespace: nginx-gateway
  # 게이트웨이의 sttep-https 리스너(*.sttep.work)가 이 이름을 받는다.
  hostnames:
    - "dev-files.sttep.work"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rustfs
          port: 9000
