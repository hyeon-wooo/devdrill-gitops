# 관리 도구(DBeaver 등) 접속용 서비스. 앱은 postgres 서비스를 쓰고 이쪽은 보지 않는다.
#
# clusterIP 를 직접 박아 둔다. 서비스를 지웠다 다시 만들어도 IP 가 같아서 접속 설정을 고칠 필요가 없다.
# sttep 관리용 IP 는 10.100.54.0/24 에서 고른다: dev postgres 10.100.54.32, prod postgres 10.100.54.33(예약).
#
# 클러스터 밖으로는 열리지 않는다. 접속 경로는 둘 중 하나다.
#   1) DBeaver SSH 터널로 home51 을 거쳐 10.100.54.32:5432 로.
#      노드 호스트 네트워크에서는 kube-proxy 가 ClusterIP 를 라우팅해 준다.
#   2) Mac 에서 바로:  kubectl -n sttep-dev port-forward svc/postgres-admin 15432:5432
# 계정은 sttep, 비밀번호는 init-private/sttep/api/secret.yaml 의 POSTGRES_PASSWORD.
#
# NodePort 로 바꾸지 말 것. home51 에 공인 IP 가 붙어 있어 그대로 인터넷에 노출된다.
apiVersion: v1
kind: Service
metadata:
  name: postgres-admin
  namespace: sttep-dev
  labels:
    app: sttep
    tier: postgres
    env: dev
spec:
  type: ClusterIP
  clusterIP: 10.100.54.32
  selector:
    app: sttep
    tier: postgres
    env: dev
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
