# sttep dev DB. 데이터를 잃어도 되는 환경이라 오퍼레이터 없이 인스턴스 하나만 둔다.
# 버전은 로컬(source/docker-compose.yml)과 맞춘다. 비밀번호는 Secret postgres (init-private/sttep/api/).
# PostgreSQL 은 처음 기동할 때만 POSTGRES_PASSWORD 를 읽는다. 나중에 바꾸려면 DB 안에서 ALTER ROLE 도 해야 한다.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: sttep-dev
  labels:
    app: sttep
    tier: postgres
    env: dev
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: sttep
      tier: postgres
      env: dev
  template:
    metadata:
      labels:
        app: sttep
        tier: postgres
        env: dev
    spec:
      nodeSelector:
        dedicated: system
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "system"
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: sttep
            - name: POSTGRES_DB
              value: sttep
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
            # Longhorn 볼륨 루트에는 lost+found 가 있어 initdb 가 거부한다. 하위 디렉터리를 쓴다
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "sttep", "-d", "sttep"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "sttep", "-d", "sttep"]
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 10Gi
