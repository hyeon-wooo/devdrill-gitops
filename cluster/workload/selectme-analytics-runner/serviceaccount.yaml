# 개발 지표 러너(selectme 비즈니스 지표 mart 계산기)의 ServiceAccount.
#
# 이 이름(analytics-runner)과 네임스페이스(selectme-dev)는 IAM 롤 selectme-dev-analytics-runner 의 신뢰 정책 sub
# (system:serviceaccount:selectme-dev:analytics-runner)에 박혀 있다(iac stacks/dev/config.yml k8s.service_accounts).
# 하나만 바꾸면 AssumeRoleWithWebIdentity 가 거부된다.
#
# 이 클러스터는 EKS 가 아니라 pod identity webhook 이 없다. 롤 ARN 주석은 표시용이고, 실제로는 CronJob 이
# AWS_ROLE_ARN·AWS_WEB_IDENTITY_TOKEN_FILE 환경변수와 투영 토큰(audience sts.amazonaws.com)을 직접 넣는다
# (selectme-api 의 deployment.yaml 과 같은 방식).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-runner
  namespace: selectme-dev
  labels:
    app: selectme
    tier: analytics-runner
    env: dev
  annotations:
    # iac stacks/dev 출력 k8s_service_account_roles["analytics-runner"]
    eks.amazonaws.com/role-arn: arn:aws:iam::463470966956:role/selectme-dev-analytics-runner
# k8s API 는 쓰지 않는다. AWS 용 토큰은 CronJob 의 projected 볼륨으로 따로 넣는다
automountServiceAccountToken: false
