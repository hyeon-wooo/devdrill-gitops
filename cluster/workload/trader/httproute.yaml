apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: trader-route
  namespace: trader
spec:
  parentRefs:
    - name: devdrill-gateway
      namespace: nginx-gateway
  hostnames:
    - 'trader.hyeonwoo.com'
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: trader
          port: 8000
