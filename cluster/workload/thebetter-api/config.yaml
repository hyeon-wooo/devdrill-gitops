# 운영 설정. 비밀값은 없다(소셜 로그인 값은 앱에 박히는 식별자다). 애플 키 파일은 시크릿 apple-signin-key 로 붙인다.
# 값의 뜻은 thebetter-api 레포의 .env.example.
apiVersion: v1
kind: ConfigMap
metadata:
  name: thebetter-api-cm
  namespace: thebetter
  labels:
    app: thebetter-api
data:
  APP_ENV: "production"
  HTTP_ADDR: ":8080"
  DATABASE_PATH: "/data/thebetter.db"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  # 컨테이너 메모리 한도(256Mi)보다 조금 낮게. 넘기기 전에 GC 가 더 자주 돈다.
  GOMEMLIMIT: "220MiB"

  # 앱 버전 기준값. 낮은 앱의 요청은 426 으로 거절한다. 앱 배포 없이 여기서 바꾼다.
  APP_IOS_MINIMUM_VERSION: "1.0.0"
  APP_IOS_LATEST_VERSION: "1.0.0"
  # 앱스토어 앱 페이지. 앱을 등록하면 채운다.
  APP_IOS_STORE_URL: ""

  # 앱스토어 거래 확인, 아이폰 알림은 연동 없음(구매 확인은 503). 소셜 로그인은 실제 확인.
  INTEGRATIONS: "none"
  SOCIAL_LOGIN: "real"
  APPLE_TEAM_ID: "YLAPW75N8P"
  APPLE_BUNDLE_ID: "com.the9thstation.thebetter"
  APPLE_SIGNIN_KEY_ID: "8N3BM6FK58"
  APPLE_SIGNIN_KEY_PATH: "/secrets/apple/AuthKey.p8"
  GOOGLE_WEB_CLIENT_ID: "39913511827-4c79ioi6ocrtlr238jmalvrhf0qn88nb.apps.googleusercontent.com"
  KAKAO_APP_ID: "1651120"

  SCHEDULER_INTERVAL: "1m"

  # 관리자 리스너(운영자 관리 화면 internal.thebetter.day 의 백엔드). 토큰 ADMIN_TOKEN 은 시크릿 thebetter-admin-token 에서 온다.
  # 토큰이 없으면 서버는 뜨고 이 리스너만 띄우지 않는다. 8081 은 게이트웨이에 붙이지 않고 thebetter-admin 파드만 닿는다(networkpolicy.yaml).
  ADMIN_HTTP_ADDR: ":8081"
