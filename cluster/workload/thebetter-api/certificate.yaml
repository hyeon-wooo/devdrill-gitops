# 게이트웨이의 thebetter-api-https 리스너가 쓰는 인증서. 게이트웨이는 자기 네임스페이스의 시크릿만 읽으므로 nginx-gateway 에 둔다.
# 이 Application 의 destination 은 thebetter 지만 네임스페이스를 박아 두었으므로 nginx-gateway 에 만들어진다.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: thebetter-api
  namespace: nginx-gateway
spec:
  secretName: thebetter-api-tls
  issuerRef:
    name: letsencrypt-thebetter-issuer
    kind: ClusterIssuer
  dnsNames:
    - api.thebetter.day
