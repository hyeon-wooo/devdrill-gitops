# 게이트웨이가 참조하는 TLS 시크릿을 만드는 인증서. hyeonwoo-com-wildcard 와 같은 방식으로
# nginx-gateway 네임스페이스에 둔다 — 게이트웨이는 자기 네임스페이스의 시크릿만 읽는다.
#
# 이 Application 의 destination 은 selectme-dev 지만, 매니페스트에 네임스페이스가 박혀
# 있으므로 리소스는 nginx-gateway 에 만들어진다. cluster/app 쪽 infra-root 는 이 경로를
# 보지 않으니 소유자는 selectme-api Application 하나뿐이다.
#
# selectme.co.kr 은 가비아 네임서버라 Cloudflare 솔버가 레코드를 직접 쓰지 못한다.
# challenge 이름만 Cloudflare 존으로 위임해 뒀다 (가비아에 등록 완료):
#   _acme-challenge.dev-api.selectme.co.kr.  CNAME  selectme-dev-api.hyeonwoo.com.
# cert-manager 는 ClusterIssuer 의 cnameStrategy: Follow 로 이 CNAME 을 따라가 오른쪽
# 이름에 TXT 를 쓰고, Let's Encrypt 는 리졸버가 CNAME 을 따라가며 그 값을 읽는다.
# 이 파일이 CNAME 값을 참조하지는 않는다 — 값을 바꿔도 여기는 고칠 것이 없다.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: selectme-dev-api
  namespace: nginx-gateway
spec:
  secretName: selectme-dev-api-tls
  issuerRef:
    name: letsencrypt-wildcard-issuer
    kind: ClusterIssuer
  dnsNames:
    - dev-api.selectme.co.kr
