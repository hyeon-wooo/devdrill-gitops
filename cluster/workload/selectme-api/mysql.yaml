# 개발 DB. 운영은 RDS 를 계속 쓰고 이건 개발환경 전용이다.
# 앱 설정(src/common/config/development.ts)이 `synchronize: true` 라서 스키마는 부팅 시
# 엔터티로부터 생성된다. 별도 마이그레이션 잡을 두지 않는 이유다.
apiVersion: v1
kind: Service
metadata:
  name: selectme-mysql
  namespace: selectme-dev
  labels:
    app: selectme
    tier: mysql
    env: dev
spec:
  # StatefulSet 의 안정적인 파드 이름을 쓰기 위한 headless 서비스.
  # 앱은 `selectme-mysql:3306` 으로 붙는다.
  clusterIP: None
  selector:
    app: selectme
    tier: mysql
    env: dev
  ports:
    - port: 3306
      targetPort: 3306
      protocol: TCP
---
# 관리 도구(DBeaver 등) 접속용 서비스. 앱은 위의 headless 서비스를 쓰고 이쪽은 보지 않는다.
#
# headless 서비스는 ClusterIP 가 없어서 파드 IP 로만 닿는데, 파드가 다시 뜨면 IP 가 바뀌어
# 접속 설정에 박아둘 수가 없다. 그래서 IP 가 고정되는 서비스를 하나 더 둔다.
#
# 클러스터 밖으로는 열리지 않는다. 접속 경로는 둘 중 하나다.
#   1) Mac 에서 바로:  kubectl -n selectme-dev port-forward svc/selectme-mysql-admin 13306:3306
#   2) DBeaver SSH 터널로 home51 을 거쳐 아래 ClusterIP 로:
#        kubectl -n selectme-dev get svc selectme-mysql-admin -o jsonpath='{.spec.clusterIP}'
#      노드 호스트 네트워크에서는 kube-proxy 가 ClusterIP 를 라우팅해 준다.
#
# NodePort 로 바꾸지 말 것. home51 에 공인 IP 가 붙어 있어 그대로 인터넷에 노출된다.
apiVersion: v1
kind: Service
metadata:
  name: selectme-mysql-admin
  namespace: selectme-dev
  labels:
    app: selectme
    tier: mysql
    env: dev
spec:
  type: ClusterIP
  selector:
    app: selectme
    tier: mysql
    env: dev
  ports:
    - port: 3306
      targetPort: 3306
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: selectme-mysql
  namespace: selectme-dev
  labels:
    app: selectme
    tier: mysql
    env: dev
spec:
  serviceName: selectme-mysql
  replicas: 1
  selector:
    matchLabels:
      app: selectme
      tier: mysql
      env: dev
  template:
    metadata:
      labels:
        app: selectme
        tier: mysql
        env: dev
    spec:
      nodeSelector:
        dedicated: system
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "system"
      containers:
        - name: mysql
          image: mysql:8.4
          args:
            # 앱은 timezone '+00:00' 로 접속하고 charset 은 utf8mb4 다. 서버 기본값을
            # 거기 맞춰 둬야 세션 설정을 빠뜨린 경로에서 값이 틀어지지 않는다.
            - "--character-set-server=utf8mb4"
            - "--collation-server=utf8mb4_unicode_ci"
            - "--default-time-zone=+00:00"
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                name: selectme-mysql-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          # 초기화(첫 기동)는 수십 초가 걸린다. startupProbe 로 그 구간을 덮는다.
          startupProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
            periodSeconds: 5
            failureThreshold: 36 # 최대 180초
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
            periodSeconds: 20
            timeoutSeconds: 3
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageclass.yaml 참고. replica 1개를 파드와 같은 노드에 고정한다.
        storageClassName: selectme-longhorn-local
        resources:
          requests:
            storage: 20Gi
