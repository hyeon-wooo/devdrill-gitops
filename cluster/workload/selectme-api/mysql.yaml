# 개발 DB. 운영은 RDS 를 계속 쓰고 이건 개발환경 전용이다.
# 앱 설정(src/common/config/development.ts)이 `synchronize: true` 라서 스키마는 부팅 시
# 엔터티로부터 생성된다. 별도 마이그레이션 잡을 두지 않는 이유다.
apiVersion: v1
kind: Service
metadata:
  name: selectme-mysql
  namespace: selectme-dev
  labels:
    app: selectme
    tier: mysql
    env: dev
spec:
  # StatefulSet 의 안정적인 파드 이름을 쓰기 위한 headless 서비스.
  # 앱은 `selectme-mysql:3306` 으로 붙는다.
  clusterIP: None
  selector:
    app: selectme
    tier: mysql
    env: dev
  ports:
    - port: 3306
      targetPort: 3306
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: selectme-mysql
  namespace: selectme-dev
  labels:
    app: selectme
    tier: mysql
    env: dev
spec:
  serviceName: selectme-mysql
  replicas: 1
  selector:
    matchLabels:
      app: selectme
      tier: mysql
      env: dev
  template:
    metadata:
      labels:
        app: selectme
        tier: mysql
        env: dev
    spec:
      nodeSelector:
        dedicated: system
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "system"
      containers:
        - name: mysql
          image: mysql:8.4
          args:
            # 앱은 timezone '+00:00' 로 접속하고 charset 은 utf8mb4 다. 서버 기본값을
            # 거기 맞춰 둬야 세션 설정을 빠뜨린 경로에서 값이 틀어지지 않는다.
            - "--character-set-server=utf8mb4"
            - "--collation-server=utf8mb4_unicode_ci"
            - "--default-time-zone=+00:00"
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                name: selectme-mysql-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          # 초기화(첫 기동)는 수십 초가 걸린다. startupProbe 로 그 구간을 덮는다.
          startupProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
            periodSeconds: 5
            failureThreshold: 36 # 최대 180초
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
            periodSeconds: 20
            timeoutSeconds: 3
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageclass.yaml 참고. replica 1개를 파드와 같은 노드에 고정한다.
        storageClassName: selectme-longhorn-local
        resources:
          requests:
            storage: 20Gi
