# AWS 자격증명은 장기 키 없이 이 ServiceAccount 토큰으로 받는다. 클러스터 issuer 를
# AWS IAM OIDC provider 로 등록해 두었고, 롤 selectme-dev-api 의 신뢰 정책이 이 SA 의
# sub(system:serviceaccount:selectme-dev:selectme-api)만 받는다. SA 이름을 바꾸면 assume 이 깨진다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: selectme-api
  namespace: selectme-dev
# k8s API 는 쓰지 않는다. AWS 용 토큰은 아래 projected 볼륨으로 따로 넣는다.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: selectme-api
  namespace: selectme-dev
  labels:
    app: selectme
    tier: api
    env: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: selectme
      tier: api
      env: dev
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: selectme
        tier: api
        env: dev
    spec:
      serviceAccountName: selectme-api
      nodeSelector:
        dedicated: system
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "system"
      imagePullSecrets:
        - name: ecr-auth
      volumes:
        - name: aws-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 3600
                  path: token
      containers:
        - name: selectme-api
          # 태그는 커밋 SHA 기반 불변 태그다. selectme-api 레포의 GitHub Actions 가
          # 이 값을 바꿔 커밋하면 그것이 곧 배포다. 가변 태그로 되돌리지 말 것.
          image: 463470966956.dkr.ecr.ap-northeast-2.amazonaws.com/selectme-api:dev-914c0f1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: selectme-api-cm
            # init-private/selectme-api/secret.yaml 참고.
            - secretRef:
                name: selectme-api-secret
          # AWS SDK 기본 체인이 이 두 값을 보고 AssumeRoleWithWebIdentity 를 한다.
          # AWS_ACCESS_KEY_ID 가 같이 있으면 그쪽이 먼저 쓰이니 장기 키 시크릿을 다시 붙이지 말 것.
          env:
            - name: AWS_REGION
              value: ap-northeast-2
            - name: AWS_ROLE_ARN
              value: arn:aws:iam::463470966956:role/selectme-dev-api
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/aws/token
          volumeMounts:
            - name: aws-token
              mountPath: /var/run/secrets/aws
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # 부팅(스키마 동기화 등)이 끝날 때까지 첫 응답이 늦다. startupProbe 로
          # 그 구간을 덮고, liveness 는 startup 통과 뒤부터 짧은 주기로 돈다.
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
            failureThreshold: 24 # 최대 120초
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
