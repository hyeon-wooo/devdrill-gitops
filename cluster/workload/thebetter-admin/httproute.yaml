# internal.thebetter.day. 클라우드플레어 프록시를 끈 DNS 레코드(집 공인 IP)로 들어와 게이트웨이의 thebetter-internal-https 리스너가 받는다.
# 라우트는 관리 화면(nginx)만 가리킨다. API 의 관리자 포트(8081)는 게이트웨이에 붙이지 않는다. nginx 가 클러스터 안에서 넘긴다.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: thebetter-admin-route
  namespace: thebetter
spec:
  parentRefs:
    - name: devdrill-gateway
      namespace: nginx-gateway
      sectionName: thebetter-internal-https
  hostnames:
    - "internal.thebetter.day"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: thebetter-admin
          port: 8080
---
# http 로 들어온 요청은 https 로 돌려보낸다. 관리자 토큰이 평문으로 지나가지 않게 한다.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: thebetter-admin-http-redirect
  namespace: thebetter
spec:
  parentRefs:
    - name: devdrill-gateway
      namespace: nginx-gateway
      sectionName: http
  hostnames:
    - "internal.thebetter.day"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
