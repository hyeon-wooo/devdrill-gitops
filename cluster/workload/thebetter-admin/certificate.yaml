# 관리 화면의 nginx 가 직접 TLS 를 끝낼 때 쓰는 인증서. 게이트웨이를 거치지 않으므로 파드와 같은 thebetter 네임스페이스에 둔다.
# DNS01(클라우드플레어)로 받으므로 internal.thebetter.day 가 내부 IP 를 가리켜도 발급된다.
# 파드보다 먼저 준비되게 sync-wave 를 앞에 둔다(ArgoCD 는 Certificate 가 Ready 가 될 때까지 다음 단계를 기다린다).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: thebetter-internal
  namespace: thebetter
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: thebetter-internal-tls
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: letsencrypt-thebetter-issuer
    kind: ClusterIssuer
  dnsNames:
    - internal.thebetter.day
