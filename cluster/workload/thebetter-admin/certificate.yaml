# 게이트웨이의 thebetter-internal-https 리스너가 쓰는 인증서. 게이트웨이는 자기 네임스페이스의 시크릿만 읽으므로 nginx-gateway 에 둔다.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: thebetter-internal
  namespace: nginx-gateway
spec:
  secretName: thebetter-internal-tls
  issuerRef:
    name: letsencrypt-thebetter-issuer
    kind: ClusterIssuer
  dnsNames:
    - internal.thebetter.day
