# 운영 핵심여정 합성 검사기(selectme-web 레포 journey/). 매시 운영을 상대로 가입 → 로그인 → 이력서 → 공고 → 결제창 직전을
# 화면으로 돌리고, 결과를 Grafana IRM 에 보낸다(여정 실패 = SEV2, heartbeat 끊김 = 검사기 죽음).
#
# 비밀값은 init-private/selectme-journey/secret.yaml(git 에 없음). SYNTHETIC_KEY 는 운영 api 의
# /selectme/prod/api/synthetic/key 와 같은 값이어야 한다 — 다르면 운영 가입 화면이 실제 문자를 보낸다. 실행기가 비어 있으면 멈추지만
# 틀린 값은 걸러 내지 못하고, api 가 403 을 돌려 purge 단계에서 실패한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: selectme-journey-cm
  namespace: selectme-dev
  labels:
    app: selectme
    tier: journey
    env: prod-target
data:
  JOURNEY_BASE_URL: "https://www.selectme.co.kr"
  JOURNEY_API_URL: "https://api.selectme.co.kr"
  JOURNEY_UPLOADS: "real"
  JOURNEY_PG_SIGNAL: "on"
  TZ: "Asia/Seoul"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: selectme-journey
  namespace: selectme-dev
  labels:
    app: selectme
    tier: journey
spec:
  # 매시 7분. 정각은 다른 배치(운영 api 의 정각 배치 등)와 겹친다
  schedule: "7 * * * *"
  timeZone: "Asia/Seoul"
  # 처음에는 멈춘 채 둔다. 운영 api 에 합성 장치가 배포되고 시크릿이 채워진 뒤 false 로 바꾼다
  suspend: false
  # 앞 run 이 끝나지 않았으면 겹쳐 돌지 않는다(같은 운영 계정 정리가 섞인다)
  concurrencyPolicy: Forbid
  # 이 시간 안에 못 떴으면 그 회차는 버린다. 다음 정시에 다시 돈다
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 실패해도 다시 돌리지 않는다 — 재시도는 여정을 한 번 더 돌려 운영 데이터만 더 만든다. 실패는 IRM 알림으로 끝이다
      backoffLimit: 0
      # 여정 9단계 + 단계 사이 30초 간격으로 7~8분이다. 실행기 자체 상한(13분)보다 길게 두어 결과 전송까지 끝나게 한다
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app: selectme
            tier: journey
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            dedicated: system
          tolerations:
            - key: "dedicated"
              operator: "Equal"
              value: "system"
          imagePullSecrets:
            - name: ecr-auth
          volumes:
            # Chromium 은 /dev/shm 이 작으면(컨테이너 기본 64Mi) 렌더러가 죽는다
            - name: shm
              emptyDir:
                medium: Memory
                sizeLimit: 512Mi
          containers:
            - name: journey
              # 태그는 selectme-web 레포 GitHub Actions(journey-image.yml)가 바꿔 커밋한다. 가변 태그로 되돌리지 말 것
              image: 463470966956.dkr.ecr.ap-northeast-2.amazonaws.com/selectme-journey:dev-9a65baf
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: selectme-journey-cm
                # init-private/selectme-journey/secret.yaml 참고
                - secretRef:
                    name: selectme-journey-secret
              volumeMounts:
                - name: shm
                  mountPath: /dev/shm
              resources:
                requests:
                  cpu: "1"
                  memory: 1536Mi
                limits:
                  cpu: "2"
                  memory: 2Gi
