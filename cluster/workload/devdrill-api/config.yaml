apiVersion: v1
kind: ConfigMap
metadata:
  name: devdrill-api-cm
  namespace: devdrill-prod
  labels:
    app: devdrill
    tier: api
    env: prod
data:
  NODE_ENV: "production"
  PORT: "3000"

  FILE_BASE_URL: "https://api.devdrill.net"
  FILE_PUBLIC_STORAGE: "/app/data/public"

  # Collector 를 내렸으므로(disabled/otel-collector) SDK 도 끈다.
  OTEL_SDK_DISABLED: "true"
  OTEL_NODE_RESOURCE_DETECTORS: "none"
  OTEL_JS_INSTRUMENTATION_IOREDIS_ENABLED: "false"
