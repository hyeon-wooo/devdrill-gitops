# P2 시장 탭. 키가 없으면(fund-data 없음) 한국 시리즈와 미국 발표 일정만 건너뛴다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: market
  namespace: fund
spec:
  schedule: "20 7,16 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext: { runAsUser: 1000, runAsGroup: 1000 }
          imagePullSecrets: [{ name: ghcr-auth }]
          containers:
            - name: market
              image: ghcr.io/hyeon-wooo/fund-system-api:sha-2aed63f
              command: ["fund-collect", "market"]
              envFrom: [{ configMapRef: { name: fund-cm } }, { secretRef: { name: fund-data, optional: true } }]
              env:
                - name: DATABASE_URL
                  valueFrom: { secretKeyRef: { name: fund-secret, key: DATABASE_URL } }
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: 500m, memory: 768Mi }
