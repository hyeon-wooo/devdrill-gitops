apiVersion: batch/v1
kind: CronJob
metadata:
  name: prices
  namespace: fund
spec:
  schedule: "10 7,16 * * 1-5"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext: { runAsUser: 1000, runAsGroup: 1000 }
          imagePullSecrets: [{ name: ghcr-auth }]
          containers:
            - name: prices
              image: ghcr.io/hyeon-wooo/fund-system-api:sha-b04b10a
              command: ["fund-collect", "prices"]
              envFrom: [{ configMapRef: { name: fund-cm } }, { secretRef: { name: fund-secret } }]
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: 500m, memory: 768Mi }
---
