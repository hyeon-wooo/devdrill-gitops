# KIS 실전 키(fund-kis)는 kis-sync 에만 주입한다. 데이터 키(fund-data: FRED, ECOS)는 market 에만 주입한다.
# 다른 작업은 DATABASE_URL만 받는다 (사무실 D-005, 리뷰 #4).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: prices
  namespace: fund
spec:
  schedule: "10 7,16 * * 1-5"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext: { runAsUser: 1000, runAsGroup: 1000 }
          imagePullSecrets: [{ name: ghcr-auth }]
          containers:
            - name: prices
              image: ghcr.io/hyeon-wooo/fund-system-api:sha-2aed63f
              command: ["fund-collect", "prices"]
              envFrom: [{ configMapRef: { name: fund-cm } }]
              env:
                - name: DATABASE_URL
                  valueFrom: { secretKeyRef: { name: fund-secret, key: DATABASE_URL } }
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: 500m, memory: 768Mi }
---
