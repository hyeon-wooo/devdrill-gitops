apiVersion: v1
kind: Service
metadata:
  name: fund-db
  namespace: fund
spec:
  selector: { app: fund-db }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fund-db
  namespace: fund
spec:
  serviceName: fund-db
  replicas: 1
  selector: { matchLabels: { app: fund-db } }
  template:
    metadata: { labels: { app: fund-db } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: fund }
            - { name: POSTGRES_DB, value: fund }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: fund-secret, key: POSTGRES_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "fund"] }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources: { requests: { storage: 10Gi } }
