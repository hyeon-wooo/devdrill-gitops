# sttep 개발환경. sttep-api 레포의 GitHub Actions 가 workload/sttep-dev/api/deployment.yaml 의
# 이미지 태그를 커밋하면 그것이 곧 배포다.
# Secret 은 이 레포에 없다. init-private/sttep/ 의 원문을 kubectl apply 로 넣는다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sttep-dev
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: "git@github.com:hyeon-wooo/devdrill-gitops.git"
      targetRevision: HEAD
      path: cluster/workload/sttep-dev
      directory:
        recurse: true
  destination:
    server: "https://kubernetes.default.svc"
    namespace: sttep-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
