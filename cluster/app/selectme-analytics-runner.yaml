apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: selectme-analytics-runner
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: devdrill-cicd
spec:
  project: default
  sources:
    - repoURL: "git@github.com:hyeon-wooo/devdrill-gitops.git"
      targetRevision: HEAD
      path: cluster/workload/selectme-analytics-runner
  destination:
    server: "https://kubernetes.default.svc"
    # 개발 api·개발 MySQL 과 같은 네임스페이스. ECR imagePullSecret(ecr-auth)과 selectme-mysql 서비스를 그대로 쓴다
    namespace: selectme-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
