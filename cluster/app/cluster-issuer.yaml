# 78일간 클러스터에 수동으로만 존재하던 리소스를 git 으로 가져온다. spec 은 살아 있는
# 리소스의 last-applied 와 동일하고, `cnameStrategy` 한 줄만 더했다.
#
# selectme.co.kr 의 네임서버는 가비아라 Cloudflare 솔버가 직접 레코드를 쓸 수 없다.
# 대신 가비아에 `_acme-challenge.dev-api.selectme.co.kr` → Cloudflare 존의 이름으로
# CNAME 을 하나 박아두고, cert-manager 가 그 CNAME 을 따라가 Cloudflare 쪽에
# TXT 를 쓰게 한다. `Follow` 가 그 추적을 켜는 스위치다.
#
# 기존 hyeonwoo.com 발급에는 영향이 없다. `_acme-challenge.hyeonwoo.com` 에는 CNAME 이
# 없으므로 따라갈 것이 없고, 솔버는 지금까지와 똑같이 동작한다.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-wildcard-issuer
spec:
  acme:
    email: hyeonwoo.v24@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-wildcard-issuer-account-key
    solvers:
      - dns01:
          cnameStrategy: Follow
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
