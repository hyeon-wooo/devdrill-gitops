apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: selectme-journey
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: devdrill-cicd
spec:
  project: default
  sources:
    - repoURL: "git@github.com:hyeon-wooo/devdrill-gitops.git"
      targetRevision: HEAD
      path: cluster/workload/selectme-journey
  destination:
    server: "https://kubernetes.default.svc"
    # 개발 api 와 같은 네임스페이스에 둔다 — ECR imagePullSecret(ecr-auth)을 그대로 쓴다.
    # 검사 대상은 운영(www.selectme.co.kr)이고 이 클러스터 안의 것은 아무것도 부르지 않는다
    namespace: selectme-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
