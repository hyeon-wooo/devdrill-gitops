# 더나은 운영자 관리 화면(internal.thebetter.day). 이미지 태그는 thebetter-admin 레포의 GitHub Actions(production 브랜치 푸시)가 바꿔 커밋한다.
# 로그인 TOTP 비밀(시크릿 thebetter-admin-token 의 키 totp)은 git 에 없다. init-private/thebetter/admin-totp.sh 로 사람이 넣는다.
# 집 내부망·VPN 전용(NodePort 31443). 공개 게이트웨이에 붙이지 않는다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: thebetter-admin
  namespace: argocd
  annotations:
    # devdrill 앱들과 같이 동기화가 끝나면 슬랙 devdrill-cicd 채널에 알린다(argocd-notifications-cm 의 on-sync-succeeded).
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: devdrill-cicd
spec:
  project: default
  sources:
    - repoURL: "git@github.com:hyeon-wooo/devdrill-gitops.git"
      targetRevision: HEAD
      path: cluster/workload/thebetter-admin
  destination:
    server: "https://kubernetes.default.svc"
    namespace: thebetter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
