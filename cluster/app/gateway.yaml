apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: devdrill-gateway
  namespace: nginx-gateway
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All

    # api.devdrill.net
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "api.devdrill.net"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: devdrill-tls-secret

    # hyeonwoo.com
    - name: hyeonwoo-com-root-https
      protocol: HTTPS
      port: 443
      hostname: "hyeonwoo.com"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: hyeonwoo-tls
    - name: hyeonwoo-com-https
      protocol: HTTPS
      port: 443
      hostname: "*.hyeonwoo.com"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: hyeonwoo-tls

    # dev-api.selectme.co.kr (selectme 개발 API)
    # 인증서는 cluster/app/certificate-selectme.yaml 이 만든다.
    - name: selectme-dev-api-https
      protocol: HTTPS
      port: 443
      hostname: "dev-api.selectme.co.kr"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: selectme-dev-api-tls

    # demo.selectme.co.kr (selectme 데모 호스팅)
    # 인증서는 cluster/workload/selectme-demo/certificate-selectme-demo.yaml 이 만든다.
    - name: selectme-demo-https
      protocol: HTTPS
      port: 443
      hostname: "demo.selectme.co.kr"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: selectme-demo-tls

    # *.sttep.work (sttep dev·prod). 인증서는 cluster/app/certificate-sttep.yaml 이 만든다.
    - name: sttep-https
      protocol: HTTPS
      port: 443
      hostname: "*.sttep.work"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: sttep-tls

    # api.thebetter.day (더나은 운영 API). 인증서는 cluster/workload/thebetter-api/certificate.yaml 이 만든다.
    # 다른 네임스페이스의 라우트가 이 이름을 가로채지 않게 thebetter 네임스페이스의 라우트만 받는다.
    - name: thebetter-api-https
      protocol: HTTPS
      port: 443
      hostname: "api.thebetter.day"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: thebetter
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: thebetter-api-tls
