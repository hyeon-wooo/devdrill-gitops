# 더나은 API 운영 서버. 이미지 태그는 thebetter-api 레포의 GitHub Actions(production 브랜치 푸시)가 바꿔 커밋한다.
# 시크릿(GHCR 풀, 애플 로그인 키)은 git 에 없다. init-private/thebetter/ 의 파일을 사람이 채워 직접 apply 한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: thebetter-api
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: "git@github.com:hyeon-wooo/devdrill-gitops.git"
      targetRevision: HEAD
      path: cluster/workload/thebetter-api
  destination:
    server: "https://kubernetes.default.svc"
    namespace: thebetter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
